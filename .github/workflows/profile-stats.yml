name: Update profile stats

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          theme: darkhub
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update profile stats cards"
          git push
